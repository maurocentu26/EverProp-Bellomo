        "/api/v1/auth/activate": {
            "post": {
                "summary": "Activate pending account using a single-use tenant-bound token",
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "object",
                                "required": [
                                    "token",
                                    "password",
                                    "password_confirmation"
                                ],
                                "properties": {
                                    "token": {
                                        "maxLength": 64,
                                        "minLength": 64,
                                        "type": "string"
                                    },
                                    "password_confirmation": {
                                        "format": "password",
                                        "type": "string"
                                    },
                                    "password": {
                                        "minLength": 12,
                                        "format": "password",
                                        "type": "string"
                                    }
                                }
                            }
