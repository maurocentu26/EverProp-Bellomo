name: Agent guard

on:
  pull_request:
    paths: ['.claude/hooks/**', '.github/workflows/guard.yml']
  push:
    branches: [main]
    paths: ['.claude/hooks/**', '.github/workflows/guard.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .claude/hooks/guard.test.mjs
