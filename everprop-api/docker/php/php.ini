expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
memory_limit=256M
max_execution_time=30
max_input_time=30
post_max_size=16M
upload_max_filesize=10M
max_file_uploads=10
date.timezone=UTC
session.use_strict_mode=1
opcache.enable=1
opcache.validate_timestamps=1
opcache.memory_consumption=128
opcache.max_accelerated_files=20000
