name: Ticket branch

# TICKETS.md: develop takes ticket branches; main takes clean release/hotfix branches.
on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  name:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: proposed
      - name: Load policy from protected develop
        if: github.base_ref == 'main'
        uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
          path: trusted-policy
          sparse-checkout: .github/scripts
      - name: Branch and production tree respect ticket policy
        working-directory: proposed
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          PR_TREE: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$BASE" = "main" ]; then
            echo "Policy SHA: $(git -C ../trusted-policy rev-parse HEAD)"
            node ../trusted-policy/.github/scripts/check-pr-policy.mjs
          else
            node .github/scripts/check-pr-policy.mjs
          fi
      - name: Policy regression tests
        working-directory: ${{ github.base_ref == 'main' && 'trusted-policy' || 'proposed' }}
        run: node --test .github/scripts/check-pr-policy.test.mjs
