name: Eval dataset

on:
  pull_request:
    paths: ['evals/**', '.github/workflows/evals.yml']
  push:
    branches: [main, chore/agentic-setup] # staging branch: the AI module lives here, never on main
    paths: ['evals/**', '.github/workflows/evals.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node evals/validate.mjs
