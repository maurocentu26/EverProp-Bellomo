        "/api/v1/public/leads": {
            "parameters": [
                {
                    "$ref": "#/components/parameters/TenantHeader"
                }
            ],
            "post": {
                "tags": [
                    "CRM"
                ],
                "operationId": "createPublicLead",
                "summary": "Submit an idempotent public lead",
                "parameters": [
                    {
                        "$ref": "#/components/parameters/IdempotencyKey"
                    },
                    {
                        "$ref": "#/components/parameters/XsrfHeader"
                    }
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/PublicLeadRequest"
                            },
                            "example": {
                                "contact": {
                                    "display_name": "Ana Pérez",
                                    "email": "ana@example.test",
                                    "locale": "es-AR"
                                },
                                "identity": {
                                    "channel_type": "EMAIL",
                                    "provider_user_id": "ana@example.test"
                                },
                                "consent": {
                                    "purpose_code": "COMMERCIAL_CONTACT",
                                    "status": "GRANTED",
                                    "legal_text_version": "2026-08"
                                },
                                "lead": {
                                    "source_channel": "WEB_FORM",
                                    "source_kind": "PROPERTY_INQUIRY",
                                    "priority": "NORMAL"
                                },
                                "property_public_id": "b1100000-0000-4000-8000-000000001001",
                                "touchpoint": {
                                    "type": "WEB_FORM",
                                    "summary": "Consulta desde la ficha"
                                }
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "$ref": "#/components/responses/LeadAccepted"
                    },
                    "201": {
                        "$ref": "#/components/responses/LeadAccepted"
                    },
                    "409": {
                        "$ref": "#/components/responses/Conflict"
                    },
                    "419": {
                        "$ref": "#/components/responses/CsrfMismatch"
                    },
                    "422": {
                        "$ref": "#/components/responses/ValidationError"
                    },
                    "429": {
                        "$ref": "#/components/responses/TooManyRequests"
                    }
                }
            }
        },
        "/api/v1/webhooks/{integrationPublicId}": {
            "parameters": [
                {
                    "$ref": "#/components/parameters/TenantHeader"
                },
                {
                    "name": "integrationPublicId",
                    "in": "path",
                    "required": true,
                    "schema": {
                        "type": "string",
                        "format": "uuid"
                    }
                }
            ],
            "post": {
                "tags": [
                    "Webhooks"
                ],
                "operationId": "receiveWebhook",
                "summary": "Accept a signed webhook delivery",
                "parameters": [
                    {
                        "name": "X-Everprop-Timestamp",
                        "in": "header",
                        "required": true,
                        "schema": {
                            "type": "string",
                            "pattern": "^[0-9]{10}$"
                        }
                    },
                    {
                        "name": "X-Everprop-Signature",
                        "in": "header",
                        "required": true,
                        "schema": {
                            "type": "string",
                            "pattern": "^sha256=[a-fA-F0-9]{64}$"
                        }
                    },
                    {
                        "name": "X-Webhook-Idempotency-Key",
                        "in": "header",
                        "required": true,
                        "schema": {
                            "type": "string",
                            "maxLength": 191
                        }
                    },
                    {
                        "name": "X-Request-Id",
                        "in": "header",
                        "required": false,
                        "schema": {
                            "type": "string",
                            "maxLength": 191
                        }
                    }
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "type": "object",
                                "additionalProperties": true
                            },
                            "example": {
                                "event_id": "provider-event-1",
                                "event_type": "CONTACT_UPDATED",
                                "object": "contact",
                                "object_id": "provider-contact-1"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "$ref": "#/components/responses/WebhookAccepted"
                    },
                    "202": {
                        "$ref": "#/components/responses/WebhookAccepted"
                    },
                    "401": {
                        "$ref": "#/components/responses/Unauthenticated"
                    },
                    "404": {
                        "$ref": "#/components/responses/NotFound"
                    },
                    "409": {
                        "$ref": "#/components/responses/Conflict"
                    },
                    "422": {
                        "$ref": "#/components/responses/ValidationError"
                    },
                    "429": {
                        "$ref": "#/components/responses/TooManyRequests"
                    },
                    "503": {
                        "$ref": "#/components/responses/Unavailable"
                    }
                }
            }
        },
