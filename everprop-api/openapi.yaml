{
    "openapi": "3.1.0",
    "info": {
        "title": "EverProp / Bellomo API",
        "version": "1.0.0",
        "description": "Canonical tenant-aware API. Production tenancy is resolved from the configured hostname; X-Everprop-Tenant is available only in local/testing.",
        "license": {
            "name": "Proprietary",
            "identifier": "LicenseRef-Proprietary"
        }
    },
    "servers": [
        {
            "url": "http://127.0.0.1:18080",
            "description": "Local Docker"
        }
    ],
    "tags": [
        {
            "name": "Health",
            "description": "Liveness and dependency readiness."
        },
        {
            "name": "Auth",
            "description": "Sanctum SPA session lifecycle."
        },
        {
            "name": "Public inventory",
            "description": "Publicly visible tenant catalog."
        },
        {
            "name": "Admin inventory",
            "description": "Authenticated tenant-scoped inventory management."
        },
        {
            "name": "Admin CRM",
            "description": "Authenticated tenant-scoped lead and follow-up management."
        },
        {
            "name": "Notifications",
            "description": "Authenticated per-user notification inbox."
        },
        {
            "name": "CRM",
            "description": "Public lead intake and idempotency."
        },
        {
            "name": "Webhooks",
            "description": "Signed durable integration deliveries."
        }
    ],
    "security": [],
    "paths": {
        "/healthz": {
            "get": {
                "tags": [
                    "Health"
                ],
                "operationId": "health",
                "summary": "Check process liveness",
                "responses": {
                    "200": {
                        "description": "Process is alive",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/Health"
                                }
                            }
                        }
                    },
                    "400": {
                        "$ref": "#/components/responses/BadRequest"
                    }
                }
            }
        },
        "/readyz": {
            "get": {
                "tags": [
                    "Health"
                ],
                "operationId": "readiness",
                "summary": "Check MySQL and Redis readiness",
                "responses": {
                    "200": {
                        "description": "MySQL and Redis are ready",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/Readiness"
                                }
                            }
                        }
                    },
                    "400": {
                        "$ref": "#/components/responses/BadRequest"
                    },
                    "503": {
                        "$ref": "#/components/responses/Unavailable"
                    }
                }
            }
        },
        "/sanctum/csrf-cookie": {
            "get": {
                "tags": [
                    "Auth"
                ],
                "operationId": "csrfCookie",
                "summary": "Issue the SPA CSRF cookie",
                "description": "Sets the encrypted session and XSRF-TOKEN cookies. Browser clients send credentials and later echo the decoded XSRF-TOKEN as X-XSRF-TOKEN.",
                "responses": {
                    "204": {
                        "description": "CSRF cookie set"
                    },
                    "400": {
                        "$ref": "#/components/responses/BadRequest"
                    }
                }
            }
        },
        "/api/v1/auth/login": {
            "parameters": [
                {
                    "$ref": "#/components/parameters/TenantHeader"
                }
            ],
            "post": {
                "tags": [
                    "Auth"
                ],
                "operationId": "login",
                "summary": "Create a tenant-bound SPA session",
                "parameters": [
                    {
                        "$ref": "#/components/parameters/XsrfHeader"
                    }
                ],
                "requestBody": {
                    "required": true,
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/LoginRequest"
                            },
                            "example": {
                                "email": "admin@example.test",
                                "password": "replace-me"
                            }
                        }
                    }
                },
                "responses": {
                    "200": {
                        "description": "Authenticated session",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/UserEnvelope"
                                }
                            }
                        }
                    },
                    "419": {
                        "$ref": "#/components/responses/CsrfMismatch"
                    },
                    "422": {
                        "$ref": "#/components/responses/ValidationError"
                    },
                    "429": {
                        "$ref": "#/components/responses/TooManyRequests"
                    },
                    "404": {
                        "$ref": "#/components/responses/NotFound"
                    }
                }
            }
        },
