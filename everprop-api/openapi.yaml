    "components": {
        "securitySchemes": {
            "cookieAuth": {
                "type": "apiKey",
                "in": "cookie",
                "name": "everprop_api_session",
                "description": "Encrypted Sanctum SPA session cookie; actual cookie name is environment-configurable."
            }
        },
        "parameters": {
            "TenantHeader": {
                "name": "X-Everprop-Tenant",
                "in": "header",
                "required": false,
                "description": "Local/testing only. Production resolves tenant from configured hostname.",
                "schema": {
                    "type": "string"
                }
            },
            "XsrfHeader": {
                "name": "X-XSRF-TOKEN",
                "in": "header",
                "required": false,
                "description": "Required for browser requests from a Sanctum stateful origin.",
                "schema": {
                    "type": "string"
                }
            },
            "IdempotencyKey": {
                "name": "Idempotency-Key",
                "in": "header",
                "required": true,
                "schema": {
                    "type": "string",
                    "minLength": 16,
                    "maxLength": 191,
                    "pattern": "^[A-Za-z0-9._:-]+$"
                }
            },
            "Page": {
                "name": "page",
                "in": "query",
                "schema": {
                    "type": "integer",
                    "minimum": 1,
                    "default": 1
                }
            },
            "PerPage": {
                "name": "per_page",
                "in": "query",
                "schema": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100,
                    "default": 20
                }
            },
            "Direction": {
                "name": "direction",
                "in": "query",
                "schema": {
                    "type": "string",
                    "enum": [
                        "asc",
                        "desc"
                    ],
                    "default": "desc"
                }
            },
            "ProjectPublicId": {
                "name": "project",
                "in": "path",
                "required": true,
                "schema": {
                    "type": "string",
                    "format": "uuid"
                }
            },
            "PropertyPublicId": {
                "name": "property",
                "in": "path",
                "required": true,
                "schema": {
                    "type": "string",
                    "format": "uuid"
                }
            }
        },
        "responses": {
            "BadRequest": {
                "description": "Malformed request or untrusted host",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "Unauthenticated": {
                "description": "Unauthenticated or invalid signature",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "Forbidden": {
                "description": "Authenticated but capability/scope denied",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "NotFound": {
                "description": "Not found, not public, or hidden by tenant isolation",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "Conflict": {
                "description": "Idempotency or optimistic locking conflict",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "CsrfMismatch": {
                "description": "CSRF/session requirement failed",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "ValidationError": {
                "description": "Validation failed",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/ValidationError"
                        }
                    }
                }
            },
            "TooManyRequests": {
                "description": "Rate limit exceeded",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "Unavailable": {
                "description": "Dependency or integration secret unavailable",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/Error"
                        }
                    }
                }
            },
            "LeadAccepted": {
                "description": "Created or idempotent replay",
                "content": {
                    "application/json": {
                        "schema": {
                            "$ref": "#/components/schemas/PublicLeadEnvelope"
                        },
                        "example": {
                            "data": {
                                "lead_id": "d744ac3a-703d-4d92-9aa1-f262f3f6dbca",
                                "lead_created": true,
                                "assigned": true,
                                "property_linked": true,
                                "idempotent_replay": false
                            }
                        }
                    }
                }
